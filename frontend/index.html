<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Venda de Veículos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sistema de Vendas de Veículos</h1>
       <div class="dashboard-container">
    
    <div class="card card-azul">
        <h3>Total de Veículos</h3>
        <p id="totalCarros">0</p>
    </div>

    <div class="card card-verde">
        <h3>Valor do Estoque</h3>
        <p id="valorTotal">R$ 0,00</p>
    </div>

</div>

</div>
    </header>

    <main class="container">
        
        <section id="cadastro">
            <h2>Cadastrar Veículo</h2>
            <form id="formVeiculo">
                <input type="hidden" id="veiculoId">

                <div class="input-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" placeholder="Ex: Fiat, Ford" required>
                </div>

                <div class="input-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" placeholder="Ex: Uno, Fiesta" required>
                </div>

                <div class="input-group">
                    <label for="ano">Ano</label>
                    <input type="number" id="ano" placeholder="Ex: 2020" required>
                </div>

                <div class="input-group">
                    <label for="placa">Placa</label>
                    <input type="text" id="placa" placeholder="ABC-1234" required>
                </div>

                <div class="input-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" placeholder="Ex: 25000.00" step="0.01" required>
                </div>

                <div class="btn-container">
                    <button type="submit" id="btnSalvar">Salvar Veículo</button>
                    <button type="button" id="btnCancelar" class="hidden">Cancelar Edição</button>
                </div>
            </form>
        </section>

        <hr>

        <section id="lista">
            <h2>Estoque Disponível</h2>
            <div class="search-box" style="margin-bottom: 20px;">
    <input type="text" id="campoBusca" 
           placeholder="🔍 Digite a marca ou modelo para filtrar..." 
           style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;">
</div>

<table id="tabelaVeiculos">
            <table id="tabelaVeiculos">
                <thead>
                    <tr>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Placa</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
